version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hubvest_db
    environment:
      POSTGRES_USER: hubvest_user
      POSTGRES_PASSWORD: hubvest_password
      POSTGRES_DB: hubvest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
